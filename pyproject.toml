[project]
name = "pdfdocx-local"
version = "0.5.0"
description = "Local editable PDF to DOCX converter"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi", "uvicorn", "python-multipart", "PyMuPDF==1.26.7",
  "pdf2docx==0.5.13", "python-docx==1.2.0", "defusedxml", "psutil",
  "olefile==0.47",
  "fonttools==4.67.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
